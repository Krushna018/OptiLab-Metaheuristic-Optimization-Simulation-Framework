[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optilab-research"
version = "1.0.0"
description = "A reproducible research framework for comparing stochastic metaheuristics on continuous and graph-based optimization problems."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "networkx>=3.2"
]

[tool.setuptools.packages.find]
where = ["src"]
